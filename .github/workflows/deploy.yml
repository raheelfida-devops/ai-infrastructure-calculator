name: Deploy

# Rebuilds and reloads the app on your own server over SSH on every push to main.
# Requires three repository secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST  – server hostname or IP
#   SSH_USER  – SSH login user
#   SSH_KEY   – private key whose public half is in the server's ~/.ssh/authorized_keys
#
# Assumes the repo is already cloned on the server at ~/ai-calculator and the app
# is registered with PM2 as "ai-calculator" (see README → Deploy from GitHub).
# Until the secrets are set, this workflow will fail fast — it is inert by design.

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/ai-calculator
            git pull --ff-only
            npm ci
            npm run build
            pm2 reload ai-calculator
